version: 2

models:
  - name: stg_walmart__stores
    description: One row per store.
    columns:
      - name: store_id
        data_tests: [unique, not_null]
      - name: store_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "B", "C"]
      - name: store_size_sqft
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: stg_walmart__store_features
    description: One row per store and week.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [store_id, week_date]
    columns:
      - name: week_date
        data_tests: [not_null, is_week_ending_friday]
      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_walmart__stores')
                field: store_id

  - name: stg_walmart__weekly_sales
    description: One row per store, department and week.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [store_id, dept_id, week_date]
    columns:
      - name: week_date
        data_tests: [not_null, is_week_ending_friday]
      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_walmart__stores')
                field: store_id
