# Local, fully self-contained stack:
#   MinIO (S3 API)  ->  Airflow (LocalExecutor) running PySpark + Delta locally  ->  dbt-duckdb
# Airflow UI: http://localhost:8080 (admin/admin)   MinIO console: http://localhost:9001
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: walmart-retail-airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW_CONN_AWS_DEFAULT: >-
      {"conn_type": "aws", "login": "${MINIO_ROOT_USER:-minioadmin}",
       "password": "${MINIO_ROOT_PASSWORD:-minioadmin}",
       "extra": {"endpoint_url": "http://minio:9000", "region_name": "us-east-1"}}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_DEFAULT_REGION: us-east-1
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://minio:9000}  # set empty to use real AWS S3
    PIPELINE_ENV: docker
    PIPELINE_COMPUTE: ${PIPELINE_COMPUTE:-local}
    INCOMING_URI: ${INCOMING_URI:-s3://walmart-retail-landing/incoming}
    LAKEHOUSE_URI: ${LAKEHOUSE_URI:-s3://walmart-retail-lakehouse}
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_TARGET: ${DBT_TARGET:-docker}
    DBT_SILVER_ROOT: s3://walmart-retail-lakehouse/silver
    DBT_DUCKDB_PATH: /opt/airflow/data/warehouse/walmart.duckdb
    DUCKDB_S3_ENDPOINT: minio:9000
    PYTHONPATH: /opt/airflow/src
    SPARK_DRIVER_MEMORY: 3g
    # Databricks mode (PIPELINE_COMPUTE=databricks, DBT_TARGET=databricks) - see .env.example
    AIRFLOW_CONN_DATABRICKS_DEFAULT: ${AIRFLOW_CONN_DATABRICKS_DEFAULT:-}
    DATABRICKS_HOST: ${DATABRICKS_HOST:-}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH:-}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    UC_CATALOG: ${UC_CATALOG:-}  # dbt-databricks catalog; Spark runs on Databricks in that mode
    ALERT_SNS_TOPIC_ARN: ${ALERT_SNS_TOPIC_ARN:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
    - ivy-cache:/home/airflow/.ivy2
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/walmart-retail-landing &&
      mc mb --ignore-existing local/walmart-retail-lakehouse &&
      mc version enable local/walmart-retail-landing"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/data/warehouse
        airflow db migrate
        airflow users create --username admin --password admin --firstname Data --lastname Engineer \
          --role Admin --email admin@example.com || true
        cd /opt/airflow/dbt && dbt deps
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  ivy-cache:
