name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint + unit/Spark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 .venv && uv pip install --python .venv/bin/python -e ".[spark,dev]"
      - run: .venv/bin/ruff check src tests airflow/dags
      - run: .venv/bin/pytest --cov=retail_pipeline --cov-report=term-missing

  pipeline:
    name: End-to-end pipeline + dbt build (DuckDB)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v5
      - run: make setup
      - name: Historical load + incremental week (8 stores to keep CI fast)
        run: |
          .venv/bin/walmart-generate --out data/generated/history --stores 8 --start 2010-02-05 --end 2012-10-19
          make batch SRC=data/generated/history BATCH=2012-10-20
          .venv/bin/walmart-generate --out data/generated/week --stores 8 --start 2012-10-26 --end 2012-10-26
          make batch SRC=data/generated/week BATCH=2012-10-27
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: dbt/target/*.json

  airflow:
    name: DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install "apache-airflow==2.10.5" apache-airflow-providers-amazon apache-airflow-providers-databricks \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
          pip install -e . pytest
      - run: airflow db migrate && pytest tests/test_dags.py
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: make tf-validate
