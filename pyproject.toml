[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-pipeline"
version = "1.0.0"
description = "Walmart retail sales lakehouse: S3 + Airflow + Databricks/PySpark + dbt"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boto3>=1.34",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
]

[project.optional-dependencies]
# Spark is provided by the Databricks runtime in production; install it locally only.
spark = [
    "pyspark>=3.5.1,<3.6",
    "delta-spark>=3.2,<3.3",
]
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
]
dbt-databricks = [
    "dbt-core>=1.10,<2",
    "dbt-databricks>=1.10,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[s3]>=5",
    "ruff>=0.6",
]

[project.scripts]
walmart-generate = "retail_pipeline.generator.walmart:main"
walmart-land = "retail_pipeline.ingestion.landing:main"
walmart-run-layer = "retail_pipeline.jobs.run_layer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: tests that need a local SparkSession (Java 11/17)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "airflow/dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
